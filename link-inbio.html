<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INDI Lab | Link in Bio</title>
    <meta name="description" content="Enlaces importantes de INDI Lab." />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="css/link-in-bio.css" />
  </head>
  <body>
    <div class="bio-container">
      <!-- Profile Section -->
      <div class="profile-section">
        <!-- Using a logo or profile image from existing assets. -->
        <!-- Based on index.html there is a logo at 'svg/Secundary_Brand.svg' or we can use a generic icon if no profile pic-->
        <!-- For now using a placeholder div with the logo class/style or an img tag -->
        <img
          src="img/Brand_INDIx.svg"
          alt="INDI Lab Logo"
          class="profile-img"
          onerror="this.src='/favicon.ico'"
        />

        <h1 class="handle">@INDIxLab</h1>
        <p class="bio-text">
          Co-creating the future.<br />Laboratorio de innovación y diseño.
        </p>
      </div>

      <!-- Links Section -->
      <div class="links-container">
        <a href="/" class="bio-link">
          <span>Sitio Web Oficial</span>
        </a>
        <a href="/What_We_Do.html" class="bio-link">
          <span>Nuestros Proyectos</span>
        </a>
        <a href="/Who_We_Are.html" class="bio-link">
          <span>Nosotros</span>
        </a>
        <a href="/contact.html" class="bio-link">
          <!-- Assuming contact page or anchor -->
          <span>Contáctanos</span>
        </a>
        <!-- Placeholder for newsletter or other key CTA if needed -->
      </div>

      <!-- Blog Grid Section -->
      <div class="blog-grid-section">
        <h2 class="section-title">Latest Updates</h2>
        <div class="blog-grid">
          <!-- Item 1: Electromobility -->
          <a
            href="/projects/ElectroMovilidad/electromovilidad.html"
            class="blog-card"
          >
            <div class="blog-thumb-wrapper">
              <img
                src="/projects/ViviendaModular/images/electromovilidad.png"
                alt="Electromobility"
                class="blog-thumb"
              />
            </div>
            <div class="blog-info">
              <h3 class="blog-title">Electromobility</h3>
              <p class="blog-date">Project</p>
            </div>
          </a>

          <!-- Item 2: Urban Heat Islands -->
          <a
            href="/projects/Islas_calor_urbano/IslasDeCalorUrbano.html"
            class="blog-card"
          >
            <div class="blog-thumb-wrapper">
              <img
                src="/projects/ViviendaModular/images/Generated Image September 09, 2025 - 2_24PM.png"
                alt="Urban Heat Islands"
                class="blog-thumb"
              />
            </div>
            <div class="blog-info">
              <h3 class="blog-title">Urban Heat Islands</h3>
              <p class="blog-date">Research</p>
            </div>
          </a>

          <!-- Item 3: Modular Housing -->
          <a
            href="/projects/ViviendaModular/vivienda_modular.html"
            class="blog-card"
          >
            <div class="blog-thumb-wrapper">
              <img
                src="/projects/ViviendaModular/images/11viviendamodular-01.png"
                alt="Modular Housing"
                class="blog-thumb"
              />
            </div>
            <div class="blog-info">
              <h3 class="blog-title">Modular Housing</h3>
              <p class="blog-date">Thinking</p>
            </div>
          </a>

          <!-- Item 4: Bio-Responsive Infrastructure -->
          <a
            href="/projects/Infraestructura-bioresponsiva/infraestructura-bioresponsiva.html"
            class="blog-card"
          >
            <div class="blog-thumb-wrapper">
              <img
                src="/img/1x/Mesa de trabajo 4.png"
                alt="Bio-Responsive Infrastructure"
                class="blog-thumb"
              />
            </div>
            <div class="blog-info">
              <h3 class="blog-title">Bio-Responsive Infrastructure</h3>
              <p class="blog-date">Project</p>
            </div>
          </a>
        </div>
      </div>

      <!-- Social Footer -->
      <div class="social-footer">
        <a
          href="https://www.instagram.com/indixlab/"
          target="_blank"
          aria-label="Instagram"
        >
          <i class="fab fa-instagram social-icon"></i>
        </a>
        <a
          href="https://www.facebook.com/people/INDIxLab/61582923939627/?locale=es_LA"
          target="_blank"
          aria-label="Facebook"
        >
          <i class="fab fa-facebook-f social-icon"></i>
        </a>
        <a href="https://x.com/INDIxLab" target="_blank" aria-label="Twitter">
          <i class="fab fa-x-twitter social-icon"></i>
        </a>
        <a
          href="https://www.linkedin.com/company/indixlab"
          target="_blank"
          aria-label="LinkedIn"
        >
          <i class="fab fa-linkedin-in social-icon"></i>
        </a>
      </div>
    </div>
  </body>
</html>
