        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

        <script>
          gsap.registerPlugin(ScrollTrigger);

          ScrollTrigger.matchMedia({
            // 🖥️ Desktop: Pinned Carousel Animation
            "(min-width: 769px)": function () {
              const phrases = gsap.utils.toArray(".list .phrase");
              
              // Initial setup: all invisible except first one potentially (handled by timeline)
              gsap.set(phrases, { opacity: 0, scale: 0.95, filter: "blur(10px)", y: 20 });
              
              // Master timeline linked to scroll
              const tl = gsap.timeline({
                scrollTrigger: {
                  trigger: ".list",
                  start: "top top",
                  end: "+=" + phrases.length * 100 + "%", // Extend scroll distance for reading time
                  scrub: 1, // Smooth interaction
                  pin: true,
                  anticipatePin: 1,
                },
              });

              phrases.forEach((phrase, i) => {
                // Determine timing
                // We want: Fade In -> Stay -> Fade Out
                // Overlap: Next one fades in while previous fades out? Or sequential?
                // Let's do a cross-fade style: 
                // 1. Enter
                // 2. Hold
                // 3. Exit (unless last one)

                const durationIn = 1;
                const durationHold = 2; // Increased for long text reading
                const durationOut = 1;
                
                // Entrance
                tl.to(phrase, { 
                  opacity: 1, 
                  scale: 1, 
                  filter: "blur(0px)", 
                  y: 0, 
                  duration: durationIn, 
                  ease: "power2.out" 
                });

                // Hold
                tl.to(phrase, { 
                  opacity: 1, 
                  duration: durationHold 
                });

                // Exit (skip for the very last item if you want it to stay a bit, or fade it out to end section)
                if(i < phrases.length) {
                   tl.to(phrase, { 
                    opacity: 0, 
                    scale: 1.05, 
                    filter: "blur(10px)", 
                    y: -20, 
                    duration: durationOut, 
                    ease: "power2.in" 
                   });
                }
              });

              return () => {
                // Cleanup when screen resizes out of this match
                tl.kill();
                gsap.set(phrases, { clearProps: "all" });
              };
            },

            // 📱 Mobile: Simple Fade-In on Scroll
            "(max-width: 768px)": function () {
              const phrases = gsap.utils.toArray(".list .phrase");
              
              // Reset any specific styles from desktop if needed (handled by matchMedia cleanup usually, but good to be safe)
              gsap.set(phrases, { opacity: 0, y: 50 });

              phrases.forEach((phrase) => {
                gsap.to(phrase, {
                  opacity: 1,
                  y: 0,
                  duration: 0.8,
                  ease: "power2.out",
                  scrollTrigger: {
                    trigger: phrase,
                    start: "top 85%", // Trigger when near bottom of viewport
                    end: "top 50%",
                    toggleActions: "play none none reverse",
                  }
                });
              });
              
               return () => {
                // Cleanup
                ScrollTrigger.getAll().forEach(t => t.kill());
                gsap.set(phrases, { clearProps: "all" });
              };
            }
          });

          // Refresh on resize to ensure correct calculations
          window.addEventListener("resize", () => ScrollTrigger.refresh());
        </script>

        <script>
          window.addEventListener("DOMContentLoaded", () => {
            gsap.registerPlugin(ScrollTrigger);

            const bottomLeft = document.querySelector(".corner-bottom-left");
            const topRight = document.querySelector(".corner-top-right");
            const content = document.querySelector(".content-text");
            let tl;

            function getPositions() {
              const w = content.offsetWidth;
              const h = content.offsetHeight;

              // ⏳ breakpoint: móvil 500px
              const isMobile = window.innerWidth <= 500;

              if (isMobile) {
                return {
                  bottomLeft: { x: w / 10 - 15, y: h / 10 - 25 },
                  topRight: { x: w - 40, y: -h - 3 },
                  center: { x: w / 2 - 20, y: h / 2 - 20 },
                };
              }

              // ⏹ posiciones normales (tu código original)
              return {
                bottomLeft: { x: -50, y: -25 },
                topRight: { x: +w, y: -h - 65 },
                center: { x: w / 2 - 25, y: h / 2 - 25 },
              };
            }

            function animateCorners() {
              const pos = getPositions();

              gsap.set([bottomLeft, topRight], {
                position: "absolute",
                x: pos.center.x,
                y: pos.center.y,
                opacity: 0,
              });

              const tl = gsap.timeline({
                scrollTrigger: {
                  trigger: ".statement",
                  start: "top center",
                  end: "bottom bottom",
                  scrub: true,
                },
              });

              tl.to(bottomLeft, {
                x: pos.bottomLeft.x,
                y: pos.bottomLeft.y,
                opacity: 1,
                ease: "power3.out",
              }).to(
                topRight,
                {
                  x: pos.topRight.x,
                  y: pos.topRight.y,
                  opacity: 1,
                  ease: "power3.out",
                },
                "<"
              );

              return tl;
            }

            // Fade-in del texto
            gsap.fromTo(
              ".content-text",
              { opacity: 0.01 },
              {
                opacity: 1,
                scrollTrigger: {
                  trigger: ".statement",
                  start: "top center",
                  end: "bottom bottom",
                  scrub: true,
                },
              }
            );

            // iniciar después del delay
            setTimeout(() => {
              tl = animateCorners();
            }, 2000);

            // recalcular al hacer resize
            window.addEventListener("resize", () => {
              if (tl) {
                tl.kill();
                tl = animateCorners();
              }
            });
          });
        </script>

        <script>
          document.addEventListener("DOMContentLoaded", () => {
            // 🎨 Lista de colores posibles
            const colors = ["#18B2E8", "#F86230", "#A51C5B", "#9244D6"];
            let lastColor = null; // guardamos el último color usado

            // Seleccionamos todos los <span> y los <h2 class="white">
            const elements = document.querySelectorAll(".pdp, h2.white");

            elements.forEach((el) => {
              let randomColor;
              // Evita repetir el mismo color que el anterior
              do {
                randomColor = colors[Math.floor(Math.random() * colors.length)];
              } while (randomColor === lastColor);

              el.style.color = randomColor;
              lastColor = randomColor;
            });
          });
        </script>

          <script>
            (function () {
              const form = document.getElementById("newsletter-form");
              const email = document.getElementById("nm-email");
              const policy = document.getElementById("nm-policy");
              const msg = document.getElementById("nm-message");

              function show(message, ok = true) {
                msg.textContent = message;
                msg.style.color = ok ? "#0a0" : "#c00";
              }

              form.addEventListener("submit", function (e) {
                e.preventDefault();
                msg.textContent = "";

                if (!email.value || !/\S+@\S+\.\S+/.test(email.value)) {
                  show("Introduce un correo válido.", false);
                  email.focus();
                  return;
                }
                if (!policy.checked) {
                  show("Debes aceptar la política de privacidad.", false);
                  return;
                }

                const payload = {
                  email: email.value.trim(),
                  name: (document.getElementById("nm-name").value || "").trim(),
                  acceptedPolicy: true,
                  source: window.location.pathname,
                };

                fetch("/mail.php", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(payload),
                })
                  .then((resp) => {
                    if (!resp.ok) throw new Error("network");
                    return resp.json().catch(() => ({}));
                  })
                  .then(() => {
                    show("Gracias por suscribirte. Revisa tu correo.", true);
                    form.reset();
                  })
                  .catch(() => {
                    try {
                      const pending = JSON.parse(
                        localStorage.getItem("newsletter_pending") || "[]"
                      );
                      pending.push(payload);
                      localStorage.setItem(
                        "newsletter_pending",
                        JSON.stringify(pending)
                      );
                    } catch (err) {}
                    show("Suscripción Enviada", true);
                    form.reset();
                  });
              });
            })();
          </script>
